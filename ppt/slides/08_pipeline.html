<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>홈쉴드 — 데이터 파이프라인</title>
<link rel="stylesheet" href="../shared/style.css" />
<style>
  .pipe {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
  }
  .pipe-row {
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: 10px;
    width: 100%;
    flex-wrap: nowrap;
  }
  .pipe .st {
    background: var(--c-gray-bg);
    border-radius: var(--radius);
    padding: 18px 14px;
    text-align: center;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }
  .pipe .st .f { font-size: 20px; font-weight: 800; color: var(--c-primary); font-family: Consolas, monospace; }
  .pipe .st .c { font-size: 20px; font-weight: 500; color: var(--c-gray); margin-top: 6px; line-height: 1.35; }
  .pipe .st.final { background: var(--c-navy); }
  .pipe .st.final .f { color: var(--c-yellow); }
  .pipe .st.final .c { color: rgba(255, 255, 255, 0.8); }
  .pipe .arr {
    font-size: 22px;
    font-weight: 800;
    color: var(--c-light);
    flex: none;
    display: flex;
    align-items: center;
  }
  .pipe .arr-down {
    font-size: 22px;
    font-weight: 800;
    color: var(--c-light);
  }
  .points {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    width: 100%;
  }
  .pt {
    background: var(--c-blue-bg);
    border-radius: var(--radius);
    padding: 22px 24px;
    font-size: 21px;
    font-weight: 600;
    color: var(--c-deep);
    line-height: 1.5;
  }
  .pt b { font-weight: 800; }
</style>
</head>
<body>
  <div class="slide-viewport">
    <div class="slide-canvas">
      <div class="topbar">
        <div class="topbar-brand">
          <img src="../assets/logo.png" class="topbar-logo" alt="" />
          <span class="topbar-name">Home Shield</span>
        </div>
        <span class="topbar-page"></span>
      </div>
      <div class="content">
        <div class="content-inner" style="gap: 32px;">
          <h1 class="title">데이터 파이프라인</h1>
          <div class="pipe">
            <div class="pipe-row">
              <div class="st"><div class="f">01_raw</div><div class="c">PDF<br />API 원본</div></div>
              <span class="arr">&rarr;</span>
              <div class="st"><div class="f">02_loaded</div><div class="c">텍스트/Vision<br />하이브리드 로드</div></div>
              <span class="arr">&rarr;</span>
              <div class="st"><div class="f">03_processed</div><div class="c">정제<br />정규화</div></div>
            </div>
            <br />
            <!-- <span class="arr-down">&darr;</span> -->
            <div class="pipe-row">
              <div class="st"><div class="f">04_chunks</div><div class="c">법령 500/50<br />사례 1200/80</div></div>
              <span class="arr">&rarr;</span>
              <div class="st"><div class="f">05_vectordb</div><div class="c">임베딩<br />체크포인트</div></div>
              <span class="arr">&rarr;</span>
              <div class="st final"><div class="f">Supabase</div><div class="c">kb_chunks 적재<br />배치 500건</div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../shared/nav.js"></script>
</body>
</html>
