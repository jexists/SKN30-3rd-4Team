<!DOCTYPE html>

<link rel="stylesheet" href="../shared/style.css" />
<style>
  .future-col {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 1080px;
  }
  .future-item {
    background: var(--c-gray-bg);
    border-radius: var(--radius);
    padding: 20px 26px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .future-item .t { font-size: 21px; font-weight: 800; color: var(--c-navy); }
  .future-item .pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .future-item .box { border-radius: 12px; padding: 14px 18px; }
  .future-item .box.problem { background: var(--c-white); }
  .future-item .box.solution { background: var(--c-blue-bg); }
  .future-item .box .lbl {
    font-size: 14px;
    font-weight: 800;
    color: var(--c-gray);
    margin-bottom: 6px;
  }
  .future-item .box.solution .lbl { color: var(--c-deep); }
  .future-item .box p {
    font-size: 16px;
    font-weight: 500;
    color: #374151;
    line-height: 1.55;
    margin: 0;
  }
  .future-item .box ul {
    margin: 0;
    padding-left: 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .future-item .box li {
    font-size: 16px;
    font-weight: 600;
    color: var(--c-deep);
    line-height: 1.5;
  }
</style>
</head>

                <div class="box problem">

                  <p>등기부·계약서는 개인정보 포함 문서</p>
                </div>
                <div class="box solution">

                    <li> 개인정보가 담긴 OCR 단계의 로컬 처리 옵션 제공.</li>
                    <li>  비용/품질 비교 실측 결과 자체가 고도화 발표의 정량 자료가 됨 </li>
                  </ul>
                </div>
              </div>
