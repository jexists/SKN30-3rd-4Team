<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>홈쉴드 — 목차</title>
<link rel="stylesheet" href="../shared/style.css" />
<style>
  .toc-cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(4, 1fr);
    grid-auto-flow: column;
    gap: 14px 28px;
    width: 100%;
  }
  .toc-card {
    background: var(--c-gray-bg);
    border-radius: var(--radius);
    padding: 18px 26px;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 20px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color 0.15s ease, background 0.15s ease;
    text-align: left;
    font-family: var(--font-main);
  }
  .toc-card:hover { border-color: var(--c-primary); background: var(--c-blue-bg); }
  .toc-card .num {
    font-size: 24px;
    font-weight: 900;
    color: var(--c-primary);
    flex: none;
    width: 40px;
  }
  .toc-card .ttl {
    font-size: 21px;
    font-weight: 800;
    color: var(--c-navy);
    line-height: 1.35;
  }
</style>
</head>
<body>
  <div class="slide-viewport">
    <div class="slide-canvas">
      <div class="topbar">
        <div class="topbar-brand">
          <img src="../assets/logo.png" class="topbar-logo" alt="" />
          <span class="topbar-name">Home Shield</span>
        </div>
        <span class="topbar-page"></span>
      </div>
      <div class="content">
        <div class="content-inner" style="gap: 40px;">
          <h1 class="title">목차</h1>
          <div class="toc-cards">
            <button class="toc-card" data-file="03_team.html">
              <span class="num">01</span><span class="ttl">팀 소개</span>
            </button>
            <button class="toc-card" data-file="04_problem.html">
              <span class="num">02</span><span class="ttl">문제 정의 선정 배경</span>
            </button>
            <button class="toc-card" data-file="05_goal.html">
              <span class="num">03</span><span class="ttl">목표 기대효과</span>
            </button>
            <button class="toc-card" data-file="06_stack.html">
              <span class="num">04</span><span class="ttl">기술 스택 데이터</span>
            </button>
            <button class="toc-card" data-file="09_erd_v1.html">
              <span class="num">05</span><span class="ttl">시스템 설계 ERD · LangGraph</span>
            </button>
            <button class="toc-card" data-file="12_features.html">
              <span class="num">06</span><span class="ttl">핵심 기능 성능 평가</span>
            </button>
            <button class="toc-card" data-file="14_demo.html">
              <span class="num">07</span><span class="ttl">시연</span>
            </button>
            <button class="toc-card" data-file="15_issues.html">
              <span class="num">08</span><span class="ttl">이슈 향후 과제</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../shared/nav.js"></script>
  <script>
    document.querySelectorAll(".toc-card").forEach(function (el) {
      el.addEventListener("click", function () {
        window.location.href = el.getAttribute("data-file");
      });
    });
  </script>
</body>
</html>
