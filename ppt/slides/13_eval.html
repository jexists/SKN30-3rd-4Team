<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>홈쉴드 — 성능 평가</title>
<link rel="stylesheet" href="../shared/style.css" />
<style>
  .metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    width: 100%;
  }
  .metric {
    background: var(--c-blue-bg);
    border-radius: var(--radius);
    padding: 30px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-align: center;
  }
  .metric .v { font-size: 54px; font-weight: 900; color: var(--c-primary); line-height: 1; }
  .metric .n { font-size: 22px; font-weight: 800; }
  .metric .c { font-size: 20px; font-weight: 500; color: var(--c-gray); line-height: 1.4; }
  .tc-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    width: 100%;
  }
  .tc {
    background: var(--c-gray-bg);
    border-radius: var(--radius);
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .tc .id { font-size: 20px; font-weight: 800; color: var(--c-primary); }
  .tc .d { font-size: 20px; font-weight: 600; line-height: 1.4; }
  .honest {
    font-size: 21px;
    font-weight: 600;
    color: var(--c-gray);
    text-align: center;
  }
  .honest b { color: var(--c-red); font-weight: 800; }
</style>
</head>
<body>
  <div class="slide-viewport">
    <div class="slide-canvas">
      <div class="topbar">
        <div class="topbar-brand">
          <img src="../assets/logo.png" class="topbar-logo" alt="" />
          <span class="topbar-name">Home Shield</span>
        </div>
        <span class="topbar-page"></span>
      </div>
      <div class="content">
        <div class="content-inner" style="gap: 26px;">
          <h1 class="title">성능 평가</h1>
          <div class="metrics">
            <div class="metric">
              <span class="v">0.868</span>
              <span class="n">Faithfulness</span>
              <span class="c">답변이 법령 근거에 충실<br />환각 억제</span>
            </div>
            <div class="metric">
              <span class="v">0.68</span>
              <span class="n">Factual Correctness</span>
              <span class="c">0.50~0.89 분포</span>
            </div>
            <div class="metric">
              <span class="v">1~2초</span>
              <span class="n">응답 시간</span>
              <span class="c">일반 질의 기준</span>
            </div>
          </div>
          <p class="honest">개선점 — 재작성 루프 중첩 케이스 <b>최대 21.8초</b> 병목 &rarr; 루프 상한·게이트 튜닝 과제</p>
        </div>
      </div>
    </div>
  </div>
  <script src="../shared/nav.js"></script>
</body>
</html>
