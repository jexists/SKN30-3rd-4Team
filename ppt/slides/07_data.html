<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>홈쉴드 — 사용한 데이터</title>
<link rel="stylesheet" href="../shared/style.css" />
<style>
  .data-cards {
    display: grid;
    grid-template-columns: 1.2fr 1.2fr;
    gap: 16px;
    width: 100%;
  }
  .d-card {
    background: var(--c-gray-bg);
    border-radius: var(--radius);
    padding: 24px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .d-card .ttl { font-size: 23px; font-weight: 800; }
  .d-card .ttl small { font-size: 20px; font-weight: 600; color: var(--c-gray); }
  .d-card ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .d-card li {
    font-size: 20px;
    font-weight: 500;
    color: var(--c-gray);
    line-height: 1.45;
    padding-left: 16px;
    position: relative;
  }
  .d-card li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 11px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--c-light);
  }
  .d-card li b { color: var(--c-navy); font-weight: 800; }
  .meta-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .meta-line .lbl { font-size: 21px; font-weight: 800; color: var(--c-navy); margin-right: 6px; }
  .meta-line .tag {
    font-size: 20px;
    font-weight: 700;
    color: var(--c-deep);
    background: var(--c-blue-bg);
    padding: 8px 18px;
    border-radius: 999px;
  }
</style>
</head>
<body>
  <div class="slide-viewport">
    <div class="slide-canvas">
      <div class="topbar">
        <div class="topbar-brand">
          <img src="../assets/logo.png" class="topbar-logo" alt="" />
          <span class="topbar-name">Home Shield</span>
        </div>
        <span class="topbar-page"></span>
      </div>
      <div class="content">
        <div class="content-inner" style="gap: 28px;">
          <h1 class="title">사용한 데이터</h1>
          <div class="data-cards">
            <div class="d-card">
              <div class="ttl">🏛️ 국가법령정보센터 API <small>law.go.kr</small></div>
              <ul>
                <li>주택임대차보호법외 법령 15종</li>
                <li>보증금 권리사례외 판례 5개쟁점</li>
                <li>법령해석사례</li>
              </ul>
            </div>
            <div class="d-card">
              <div class="ttl">📄 공공 PDF</div>
              <ul>
                <li>국토교통부(주택임대차 분쟁조정 사례집)</li>
                <li>한국부동산원<br>(주택.상가건물 임대차분쟁조정 사례집)</li>
                <li>법무부 (표준 임.대차계약서 및 특약사항)</li>
                <li>서울특별시(주택임대차보호법 가이드북)</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../shared/nav.js"></script>
</body>
</html>
